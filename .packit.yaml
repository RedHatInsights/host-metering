---
# See the documentation for more information:
# https://packit.dev/docs/configuration/

specfile_path: contrib/rpm/host-metering.spec
upstream_package_name: host-metering
downstream_package_name: host-metering
upstream_tag_template: "v{version}"
srpm_build_deps:
  - git
  - make
  - curl
  - gzip
  - tar
  - rpm-build
  - golang

actions:
  create-archive:
    - "make tarball"
    - "sh -c 'echo dist/host-metering-$(make version).tar.gz'"

  get-current-version:
    - "make version"

  post-upstream-clone:
    - "make rpm/spec"

jobs:
- job: copr_build
  trigger: pull_request
  targets:
    - fedora-stable
    - rhel-8-x86_64
    - rhel-9-x86_64
    - centos-stream-9-x86_64
    - centos-stream-10-x86_64
    - rhel-10-x86_64

- job: tests
  trigger: pull_request
  identifier: "integration-tests/centos-stream"
  targets:
    - centos-stream-9-x86_64
    - centos-stream-10-x86_64

- job: tests
  trigger: pull_request
  identifier: "integration-tests/rhel"
  targets:
    rhel-8-x86_64:
      distros: [RHEL-8-Nightly]
    rhel-9-x86_64:
      distros: [RHEL-9-Nightly]
    rhel-10-x86_64:
      distros: [RHEL-10-Nightly]
  tf_extra_params:
    environments:
      - settings:
          provisioning:
            tags:
              BusinessUnit: sst_csi_client_tools
  use_internal_tf: true
