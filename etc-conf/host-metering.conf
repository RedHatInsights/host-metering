# host-metering configuration, installed as /etc/host-metering.conf.
#
# Only the [host-metering] section is recognized. Values below match the
# compiled-in defaults; uncomment and edit to override. The file is marked
# %config(noreplace) so package upgrades keep local changes.

[host-metering]
# Remote server endpoint. Defaults to the production RHEL telemetry
# ingress; use the stage host or a local Prometheus remote-write endpoint
# for testing, e.g. http://localhost:9090/api/v1/write
#write_url = https://cert.console.redhat.com/api/rhel-telemetry/v1/receive

# Interval between writes to remote server in seconds.
#write_interval_sec = 600

# Host certificate used for mTLS authentication with the remote server.
# These are the RHSM consumer identity certificates created at registration.
#host_cert_path = /etc/pki/consumer/cert.pem
#host_cert_key_path = /etc/pki/consumer/key.pem

# Interval between collecting host metrics in seconds.
#collect_interval_sec = 0

# Interval between refreshing host labels in seconds.
#label_refresh_interval_sec = 86400

# Send hostname to remote server. By default yes, set to no to disable.
#send_hostname = yes

# Number of write attempts to remote server.
#write_retry_attempts = 8

# Minimum and maximum interval between write retries in seconds.
#write_retry_min_int_sec = 1
#write_retry_max_int_sec = 10

# Timeout for write to remote server in seconds.
#write_timeout_sec = 60

# Maximum age of collected metrics in seconds. Older metrics are dropped.
#metrics_max_age_sec = 5400

# Path to directory where write ahead log files are stored.
#metrics_wal_path = /var/run/host-metering/metrics

# Log level: DEBUG, INFO, WARN, ERROR.
#log_level = INFO

# Path to log file. Default is empty - stderr, captured by the journal.
#log_path =
