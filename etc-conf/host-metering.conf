# host-metering configuration, installed as /etc/host-metering.conf.
#
# Only the [host-metering] section is recognized. Values below match the
# compiled-in defaults; uncomment and edit to override. The file is marked
# %config(noreplace) so package upgrades keep local changes.
#
# This file only lists the user-facing options. All other options described
# in host-metering.conf(5) remain configurable and are honored when set,
# they are just not advertised here.

[host-metering]
# Remote server endpoint. Defaults to the production RHEL telemetry
# ingress; use a local Prometheus remote-write endpoint for testing,
# e.g. http://localhost:9090/api/v1/write
#write_url = https://cert.console.redhat.com/api/rhel-telemetry/v1/receive

# Send hostname to remote server. By default yes, set to no to disable.
#send_hostname = yes

# Log level: DEBUG, INFO, WARN, ERROR.
#log_level = INFO

# Path to log file. Default is empty - stderr, captured by the journal.
#log_path =
